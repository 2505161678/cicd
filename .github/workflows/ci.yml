# 修改 GitHub Actions 配置文件，基于 master 分支并部署到 GitHub Pages
name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Run build
      run: npm run build

    - name: Run tests
      run: npm run test # 如果没有测试脚本，可以暂时注释掉

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: dist

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Deploy
        run: |
          # 这里添加你的部署命令
          # 例如：rsync -avz --delete dist/ user@yourserver.com:/path/to/deploy

      - name: Update version
        run: |
          echo "VUE_APP_VERSION=$(date +%Y%m%d%H%M%S)" >> .env
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          git add .env
          git commit -m "Update version"
          git push origin main